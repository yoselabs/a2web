[project]
name = "a2web"
version = "0.48.1"
description = "Agent-to-Web — adaptive web fetching MCP server and CLI for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Denis Tomilin"}]
keywords = ["mcp", "mcp-server", "model-context-protocol", "web", "scraping", "fetch", "agent", "ai", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Framework :: AsyncIO",
]
dependencies = [
    # framework — handles MCP server, CLI, ConnectionStore, formatter, DI, schema, testing.
    # The MCP substrate, direct. a2kit was retired by the `sunset-a2kit-dependency`
    # change: its App/Router/DI/formatter spine is replaced by ~300 lines a2web
    # owns (`components.py`, `scope.py`, `wire.py`, `error_wire.py`, `routers.py`).
    #
    # The >=3.4 floor is load-bearing, not hygiene. `ToolResult(is_error=True)`
    # only exists from 3.4; on 3.2/3.3 the keyword is rejected, FastMCP masks the
    # TypeError, and EVERY typed error reaches the caller as
    # `ToolResult.__init__() got an unexpected keyword argument 'is_error'` with
    # structured_content=None — real message, ErrorEnvelope, diagnostics,
    # narrative and operator hints all destroyed. That is the ADR-0009 harm class
    # structurally: a wall becomes indistinguishable from an a2web bug.
    "fastmcp>=3.4,<4",
    # typer: the CLI. NOT a new dependency in substance — a2kit's generated CLI
    # was built on Typer and pulled it transitively; the sunset made a2web the
    # one declaring it. Floor is 0.13 because `Annotated[T, typer.Option(...)]`
    # parameter rendering is what `cli.field_to_typer_annotation` produces.
    # Note the neighbouring content-extract comment: docling pins typer<0.13,
    # which is why the heavy [documents] extra stays uninstalled.
    "typer>=0.13,<1",
    # a2effect: the typed error taxonomy + `ErrorEnvelope` behind the wire's
    # `{"error": {...}}` channel. Previously reached transitively through a2kit;
    # now a direct dependency because `error_wire.py` imports it by name.
    # Repointed from the a2kit repo to the shelf 2026-07-22, once `work/a2kay`
    # merged to `main` — a2web was pinning a shelf package against a2kit's repo
    # only because the shelf copy was unreachable from `main`, and that was the
    # last thread holding a2kit's dissolution open. The shelf copy is NOT
    # byte-identical (docstrings, a ruff EM101 refactor, `noqa`/`ty` pragmas)
    # but is behaviourally equivalent — and the wire goldens are the gate that
    # SAYS so, rather than a comment asserting it should be fine.
    "a2effect",
    # lean-wire: the TSV codec + `PruneEmpty` behind the agent-facing wire.
    # Adopted from the shelf 2026-07-22, retiring the vendored `_tsv_compat.py`
    # that the sunset carried as a byte-for-byte copy of a2kit's encoder. The
    # swap is NOT cosmetic: a2kit built TSV on stdlib `csv` with QUOTE_MINIMAL,
    # which quotes a cell containing a tab or newline but leaves the raw `\n`
    # INSIDE the field — so an agent splitting the payload on `\n` (the whole
    # point of a line-oriented format) tears one record into several. lean-wire
    # escapes `\`, `\t`, `\n`, `\r` instead, so one record is always exactly
    # one physical line, reversibly.
    "lean-wire>=0.2,<1",
    # http + extraction
    # http-fetch: the shared HTTP GET primitive (browser TLS impersonation,
    # conditional GET, injected proxy + breaker, closed-verdict mapping) —
    # promoted to the shelf and adopted back (was src/a2web/packages/http_fetch).
    "http-fetch>=0.1,<1",
    # sqlite-resource + http-cache: the shared sqlite connection lifecycle and the
    # conditional-GET cache mechanics — promoted to the shelf and adopted back (was
    # src/a2web/packages/http_cache). a2web composes them at the src/a2web/cache.py
    # seam (default-path policy + cache schema + the (url, profile_hash) accessor).
    "sqlite-resource>=0.1,<1",
    "http-cache>=0.1,<1",
    # json-in-html: mine structured data embedded in HTML (LD-JSON, microdata,
    # OpenGraph, window.__X__ vars, raw JSON bodies) — promoted to the shelf and
    # adopted back (was src/a2web/packages/json_in_script).
    "json-in-html>=0.1,<1",
    # html-fragment: convert a server-supplied HTML fragment to link-preserving
    # markdown/text — promoted to the shelf and adopted back (was packages/html_fragment).
    "html-fragment>=0.1,<1",
    # record-mine: locate + render the dominant repeated-record region on listing/
    # thread pages — promoted to the shelf and adopted back (was packages/record_extract).
    "record-mine>=0.1,<1",
    # dom-schema: declared CSS extraction that reports WHY it yielded nothing —
    # OK / EMPTY (a fact about the page) / ROT (a fact about the schema). Adopted
    # 2026-07-28 after the arxiv + wikipedia markup regexes were found returning
    # zero rows against live pages, both behind green hand-written fixtures.
    "dom-schema>=0.1,<1",
    # browser-cookies: read the local browser cookie store (Chrome Keychain / Firefox
    # sqlite) — promoted to the shelf and adopted back (was packages/cookie_store). The
    # reader lib browser-cookie3 stays in a2web's optional [cookies] extra below; the
    # shelf package lazily imports it and degrades when absent.
    "browser-cookies>=0.1,<1",
    # content-extract: page -> structured content (body md via convert-md's convert_html,
    # + title/byline/date + headings/links). Promoted to the shelf, adopted back (was
    # packages/content_extract). v0.2.0 (link-affordances EVOLVE): extract_markdown gained
    # an `include_links=` passthrough (in-body anchors as markdown, off by default — a2web
    # flip gated on bench) and now retains label-less mailto:/tel: with an href-derived
    # label (live). Pulls convert-md v0.8.0 BASE (trafilatura + html2text only, + its
    # include_links param) — the heavy document engines (docling/pandoc/office) stay behind
    # convert-md's [documents] extra, which a2web does NOT install, so cold-start stays slim
    # and docling's typer<0.13 pin never collides with a2kit's Typer CLI.
    "content-extract>=0.1,<1",
    # anyllm: the LLM-provider contract (LLMProvider Protocol + Completion + PromptParts)
    # and its adapters (Anthropic Messages API, Claude Code SDK OS-session, OpenAI-compatible)
    # — promoted to the shelf and adopted back (was src/a2web/packages/llm_extract/providers).
    # The extras pull the concrete SDKs: [anthropic]=anthropic, [openai]=openai,
    # [claude-code-sdk]=claude-agent-sdk. a2web keeps its own Extractor/Judge/prompts/cache
    # and composes anyllm's provider surface via the manifests at the _manifests seam.
    "anyllm[anthropic,openai,claude-code-sdk]>=0.2,<1",
    # timefmt: the adaptive duration formatter (fmt_dur) — promoted to the shelf and
    # adopted back (was utils/time). settings-base: the generic env/YAML settings
    # machinery (${VAR} + secret-stripping YAML source) — a2web keeps its AppSettings
    # schema, secret set, and path defaults and composes it (was in settings.py).
    "timefmt>=0.1,<1",
    "settings-base>=0.1,<1",
    "plugin-surface>=0.1,<1",
    # The typed LLM-JSON funnel (promoted from packages/llm_extract/wobble/
    # 2026-07-26). a2web keeps only its product policy tables (_policies.py) and
    # a thin logger-injecting binding; the machinery is the shelf's.
    "llm-wobble>=0.1,<1",
    # The sqlite-backed TTL completion cache (promoted from
    # packages/llm_extract/cache.py 2026-07-26). Speaks anyllm.Completion; a2web
    # computes the composite key (content+ask+template) via make_key and wires it
    # over the shared SqliteResource connection.
    "llm-cache>=0.1,<1",
    # The headless-browser seam (promoted from packages/browser_backends/
    # 2026-07-26): one BrowserBackend over the Playwright-API + raw-CDP engine
    # families, consumer-free RenderedPage/BackendCookie/RenderOutcome, render
    # never raises. a2web keeps the product half — select_backend*, manifest
    # gating, the fast/robust rung split, the RenderOutcome→Verdict/hint mapping.
    # The engines themselves ride the `[browser]` extra below.
    "any-browser>=0.1,<1",
    "curl_cffi>=0.7,<1",
    "httpx>=0.27,<1",
    # cookie decryption (Chrome v10/v11 AES-GCM). Already pulled in
    # transitively by curl_cffi; promoted to direct in v0.8 so the
    # dependency is explicit at the boundary where we use it.
    "cryptography>=43,<46",
    # NOTE: `browser-cookie3` (the local-browser cookie mirror) moved OUT of
    # baseline into the optional `[cookies]` extra below (deployable-container-ci
    # image-slimming). It reads the *local* machine's Chrome/Firefox cookie store,
    # so it is inherently a LOCAL-ONLY feature — useless in a server container
    # (there is no browser there to read from). It also drags `lz4` +
    # `pycryptodome` transitively. Absent → `cookies_refresh` returns a loud
    # "install a2web[cookies]" note; normal fetches read the sqlite mirror and are
    # unaffected. `make install-global` installs it; the container never does.
    "trafilatura>=1.12,<2",
    "selectolax>=0.3,<1",
    # async + observability
    "anyio>=4,<5",
    "opentelemetry-api>=1.25,<2",
    "opentelemetry-sdk>=1.25,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.25,<2",
    # resilience
    "purgatory>=3,<4",
    # cache
    "aiosqlite>=0.20,<1",
    # config
    "pydantic-settings>=2.5,<3",
    "PyYAML>=6,<7",
    "aiofiles>=25.1,<26",
    # v0.7: LLM extraction (was the `[llm]` extra) is now baseline. `--ask`
    # works out of the box; install size jumps ~210MB because claude-agent-sdk
    # bundles the Claude Code binary in `_bundled/`. Most a2web callers run
    # inside Claude Code and rely on the OAuth piggyback — bundling is the
    # right ergonomic call. `[llm]` extra was removed in v0.7 — no alias.
    "anthropic>=0.40,<1",
    "openai>=1.40,<3",
    # markdownify is the Python equivalent of WebFetch's Turndown — used by
    # WebFetchBaseline to keep HTML→markdown behavior close to Claude Code's.
    "markdownify>=0.13,<2",
    # NOTE: `claude-agent-sdk` (the Claude Code OS-session piggyback) was moved
    # OUT of baseline to the optional `[claude-code]` extra below
    # (deployable-container-ci): it bundles a ~210MB Claude Code binary that a
    # slim server container has no use for, and the container's default backend
    # is now OpenAI-compatible (DeepSeek). The local `make install-global`
    # piggyback installs `a2web[claude-code]`, so nothing changes for the
    # OS-session workflow. This is a BREAKING packaging change for anyone who
    # relied on `pip install a2web` bringing the SDK.
    # NOTE: the browser rendering engines (`patchright` + `zendriver`) moved OUT
    # of baseline to the optional `[browser]` extra below (deployable-container-ci
    # image-slimming): patchright vendors playwright-core and its baked Chromium +
    # the full desktop system-lib tree dominate image size (~1.35GB of a 2GB
    # image), yet the browser tier is escalation-ONLY (raw/jina/paid/handlers
    # cover the common path). When absent, the browser-backend manifests report
    # `Unavailable` (find_spec gate) and the tier short-circuits to a loud
    # `try_user_browser` hint — never a crash (mirrors the LLM-provider degrade).
    # The slim published container omits it; `make install-global` and
    # `uv sync --all-extras` (dev/CI) install it.
    "gidgethub>=5.4,<6",
]

[project.optional-dependencies]
paid = ["firecrawl-py>=1,<2"]
# Browser rendering engines — the fast Chromium rung (`patchright`, `browser`
# tier) + the robust CDP rung (`zendriver`, `browser_robust` tier). Pulled via
# any-browser's own engine extras, so the version constraints live once, in the
# shelf package. Optional: baked Chromium + its desktop system libs are the bulk
# of image size, and the tier is escalation-only. Absent → backends report
# Unavailable, browser sites degrade to a loud `try_user_browser` hint. Bake into
# a container with `--build-arg INSTALL_BROWSER=true`; first browser use needs
# `patchright install chromium` (baked at image build).
browser = ["any-browser[patchright,zendriver]"]
# Claude Code OS-session piggyback (OAuth subscription / whichever auth the
# `claude` CLI is logged into — no separate API key). Bundles a ~210MB binary;
# kept out of the slim container. `make install-global` installs this extra so
# the local workflow is unchanged. Absent → the `claude-code` provider reports
# Unavailable and auto-select falls through to anthropic/openai_compatible.
claude-code = ["claude-agent-sdk>=0.1.80,<1"]
# Local-browser cookie mirror (`cookies_refresh`). Reads the local machine's
# Chrome/Firefox cookie store — a LOCAL-ONLY feature, deliberately absent from
# the server container (no browser there). Drags lz4 + pycryptodome. Absent →
# `cookies_refresh` returns a loud "install a2web[cookies]" note.
cookies = ["browser-cookie3>=0.20,<1"]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=5,<7",
    "hypothesis>=6,<7",
    "ruff>=0.7,<1",
    "ty>=0.0.1a1",
    "diff-cover>=9,<10",
    # ADR-0001 Pattern 3 (arch-fitness-functions-bootstrap):
    # Tach for module-boundary contracts ("packages/X is private; only __init__
    # is public"). The AST/call-site invariants Tach cannot see are plain pytest
    # + `ast` under `tests/architecture/` — `pytest-archon` was declared here for
    # months and imported by NOTHING, so it shipped as a dependency purchasing
    # no enforcement. Removed 2026-08-01.
    "tach>=0.20,<1",
    "pymarkdownlnt>=0.9.37",
    "pre-commit>=4.6.0",
]

[project.scripts]
a2web = "a2web.cli:main"
# Container/HTTP serve entrypoint with config-gated Google OAuth (the a2kit
# MCP-auth recipe's programmatic path — a provider object can't be a CLI flag).
# The published image's CMD uses this; `a2web serve` (open) stays for local dev.
a2web-serve = "a2web.server:serve_http_main"

[tool.uv.sources]
a2effect = { git = "https://github.com/yoselabs/shelf", subdirectory = "packages/a2effect", tag = "a2effect-v0.1.0" }
lean-wire = { git = "https://github.com/yoselabs/shelf", subdirectory = "packages/lean-wire", tag = "lean-wire-v0.2.0" }
http-fetch = { git = "https://github.com/yoselabs/shelf", subdirectory = "packages/http-fetch", tag = "http-fetch-v0.2.0" }
sqlite-resource = { git = "https://github.com/yoselabs/shelf", subdirectory = "packages/sqlite-resource", tag = "sqlite-resource-v0.1.0" }
http-cache = { git = "https://github.com/yoselabs/shelf", subdirectory = "packages/http-cache", tag = "http-cache-v0.1.0" }
json-in-html = { git = "https://github.com/yoselabs/shelf", subdirectory = "packages/json-in-html", tag = "json-in-html-v0.1.0" }
html-fragment = { git = "https://github.com/yoselabs/shelf", subdirectory = "packages/html-fragment", tag = "html-fragment-v0.1.0" }
record-mine = { git = "https://github.com/yoselabs/shelf", subdirectory = "packages/record-mine", tag = "record-mine-v0.2.0" }
dom-schema = { git = "https://github.com/yoselabs/shelf", subdirectory = "packages/dom-schema", tag = "dom-schema-v0.1.0" }
browser-cookies = { git = "https://github.com/yoselabs/shelf", subdirectory = "packages/browser-cookies", tag = "browser-cookies-v0.1.0" }
content-extract = { git = "https://github.com/yoselabs/shelf", subdirectory = "packages/content-extract", tag = "content-extract-v0.2.0" }
# anyllm is intentionally NOT pinned here. The shelf's workspace root force-sources
# anyllm (its dev group depends on it), and that source LEAKS to git consumers: a
# direct `anyllm = { ... tag = "anyllm-v0.5.0" }` pin here collides with the anyllm
# that `llm-cache` pulls transitively via the shelf workspace ("conflicting URLs for
# anyllm"). So anyllm resolves through the shelf workspace at the same tag a2web pins
# for llm-cache below — a2web always consumes anyllm THROUGH the shelf, so there is no
# independent version to pin. The `anyllm[...]>=0.2,<1` dependency line still declares
# the version floor + SDK extras; the resolved rev is captured in uv.lock.
timefmt = { git = "https://github.com/yoselabs/shelf", subdirectory = "packages/timefmt", tag = "timefmt-v0.1.0" }
settings-base = { git = "https://github.com/yoselabs/shelf", subdirectory = "packages/settings-base", tag = "settings-base-v0.1.0" }
plugin-surface = { git = "https://github.com/yoselabs/shelf", subdirectory = "packages/plugin-surface", tag = "plugin-surface-v0.1.0" }
llm-wobble = { git = "https://github.com/yoselabs/shelf", subdirectory = "packages/llm-wobble", tag = "llm-wobble-v0.4.0" }
llm-cache = { git = "https://github.com/yoselabs/shelf", subdirectory = "packages/llm-cache", tag = "llm-cache-v0.1.2" }
any-browser = { git = "https://github.com/yoselabs/shelf", subdirectory = "packages/any-browser", tag = "any-browser-v0.1.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2web"]

[tool.ruff]
target-version = "py311"
line-length = 140
output-format = "concise"
# An ARCHIVE, not live code: the harness that captured tests/contracts/cli/,
# preserved byte-for-byte so the goldens' provenance is reproducible. It imports
# a2kit and only runs in a worktree detached at d2dc5d8. Reformatting it would
# make it no longer the thing that produced the goldens.
extend-exclude = ["tests/contracts/cli/_captured_with.py"]

[tool.ruff.lint]
select = [
    "F",      # pyflakes — undefined names, unused imports
    "S",      # bandit — security
    "T10",    # leftover pdb/breakpoint()
    "T20",    # leftover print()
    "ASYNC",  # blocking-in-async detection (ASYNC100/210/230)
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # bugbear
    "C4",     # comprehensions
    "RUF",    # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts + literal test secrets allowed in tests
"tests/conftest.py" = ["S101", "S105", "S106", "E402"]  # E402: A2WEB_* env scrub MUST run before the a2web imports (hermetic REGISTRY)
"src/a2web/llm_eval/__main__.py" = ["T201"]  # CLI entry — print() is the output mechanism
"src/a2web/llm_eval/extraction_cli.py" = ["T201"]  # CLI entry — print() is the output mechanism
"src/a2web/llm_eval/browser_bakeoff.py" = ["T201"]  # CLI entry — print() is the output mechanism
"benchmarks/**" = ["T201"]  # ad-hoc benchmark scripts — print() is the output mechanism

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Real-browser smoke checks launch the actual Camoufox binary — slow, and a
# release-gate concern, not an inner-loop one. They are excluded from the
# default run here; `make test-browser` re-includes them via `-m browser`
# (a later command-line `-m` overrides this addopts default).
addopts = ["-m", "not browser"]
markers = [
    "browser: real-browser test that launches patchright + zendriver (opt-in; excluded from the default run and `make check`; the release `browser-gate` job runs these with A2WEB_REQUIRE_BROWSER=1, where a missing engine FAILS instead of skipping)",
    "ambient_llm: test that deliberately observes the HOST's real LLM availability, opting out of the `_hermetic_llm_env` scrub. Its result depends on the machine it ran on and is therefore evidence about that machine, not about the code under test. Deliberately NOT excluded from the default run: an escape hatch nobody exercises rots into one that no longer works, and this one is only correct while the fixture it opts out of still exists.",
]
# NB (ADR-0008): `filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]`
# was tried as a leak backstop and REMOVED — it promotes a rare, benign aiosqlite
# teardown-race warning into a hard ~1/15 failure, re-introducing flakiness. The
# deterministic leak detector is the `_sqlite_lifecycle` fixture's open-state
# assertion in conftest (a fact, not the racy symptom); that is the fitness
# function, and it carries no flakiness.
# Coverage is NOT in addopts — it ~doubles wall time and is a release-gate
# concern, not an inner-loop one. `make test` runs bare (fast); `make check`
# runs `make test-cov` with the coverage flags and the 85% gate.
