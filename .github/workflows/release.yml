# Release: gate the full quality bar, then build + publish the MCP-server
# image to GHCR (public) so any homelab instance can `docker pull` it.
# Triggered by pushing a `v*` tag (e.g. `git tag v0.27.0 && git push --tags`).
#
# The published image includes the browser rendering tier (patchright +
# zendriver + baked Chromium, INSTALL_BROWSER=true) so browser escalation
# works out of the box — a slimmer browserless image can still be built
# locally by omitting the build arg (see README → Deployment).
#
# Publish is single-arch (linux/amd64). Multi-arch is deferred (see BACKLOG).
# One-time after the first successful publish: set the GHCR package
# `yoselabs/a2web` visibility to Public (repo/org → Packages → Package settings),
# otherwise the pull needs auth. See README → Deployment.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # The same gate `ci.yml` runs on every push — one definition, in
  # `gate.yml`. Release runs it again rather than trusting that the tagged
  # commit was green: a tag can point at any commit, and this path publishes a
  # public image.
  gate:
    uses: ./.github/workflows/gate.yml

  # Real-launch browser gate. The default `make check` deselects the `browser`
  # marker, so NOTHING in the ordinary gate ever launches a real engine — which
  # is exactly how the zendriver robust rung shipped dead-on-launch (it could
  # not start on the pinned version) while every green stayed green. This lane
  # installs Chromium and runs the smokes with `A2WEB_REQUIRE_BROWSER=1`, under
  # which a missing/unlaunchable engine is a hard FAILURE rather than a skip —
  # the one environment obligated to prove the browser actually comes up. The
  # published image is the browser-enabled one, so `publish` waits on this.
  browser-gate:
    name: Browser gate (real launch, skips forbidden)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.12"
      - name: Sync dependencies (all extras + dev)
        run: uv sync --all-extras
      - name: Install Chromium + system deps (serves both patchright and zendriver)
        run: uv run patchright install --with-deps chromium
      - name: Launch both rungs against a real page — no skips allowed
        env:
          A2WEB_REQUIRE_BROWSER: "1"
        run: make test-browser

  publish:
    name: Build + push to GHCR
    needs: [gate, browser-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/yoselabs/a2web
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build + push (browser-enabled image)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            INSTALL_BROWSER=true
          # No INSTALL_CLAUDE_CODE — the container's default LLM backend is
          # OpenAI-compatible (DeepSeek).
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify published version matches the tag
        run: |
          IMG="ghcr.io/yoselabs/a2web:${{ steps.meta.outputs.version }}"
          GOT="$(docker run --rm --entrypoint python "$IMG" -c \
            "from importlib.metadata import version; print(version('a2web'))")"
          echo "tag=${{ steps.meta.outputs.version }} image=$GOT"
          test "$GOT" = "${{ steps.meta.outputs.version }}"
