repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check (src + tests)
        entry: uv run ruff check src/ tests/
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: ruff format (src + tests)
        entry: uv run ruff format --check src/ tests/
        language: system
        pass_filenames: false
        always_run: true
      - id: pymarkdown
        name: markdown lint (pymarkdownlnt)
        entry: uv run pymarkdown --config .pymarkdown.json scan
        language: system
        pass_filenames: true
        files: ^(README\.md|CHANGELOG\.md|CLAUDE\.md)$
      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        pass_filenames: false
        files: ^\.github/workflows/.*\.ya?ml$
      # NOTE: an `a2kit-rego` hook sat here until 2026-07-31, running
      # `uv run a2kit lint rego`. a2kit was retired on 2026-07-22, so the hook
      # had been failing to spawn ever since — it read as architectural policy
      # enforcement while enforcing nothing. The Rego lint itself is a real
      # loss and is tracked in bd issue a2web-526 ("re-home the Rego policy lint");
      # removing the dead hook makes the gap visible rather than papered over.
      - id: ty
        name: ty (typecheck src)
        entry: uv run ty check src/
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
